<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fond noir profond avec dégradé subtil -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181924"/>
      <stop offset="50%" stop-color="#0F1016"/>
      <stop offset="100%" stop-color="#090A0E"/>
    </linearGradient>

    <!-- Dégradé rouge signature Horizon Netflix -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3848"/>
      <stop offset="55%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#990008"/>
    </linearGradient>

    <!-- Dégradé de la ligne d'horizon lumineuse -->
    <linearGradient id="horizonBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3848" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#FF6B78"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FF6B78"/>
      <stop offset="100%" stop-color="#FF3848" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Lueur diffuse rouge -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Bordure lumineuse subtile -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Conteneur squircle moderne -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Halo lumineux d'ambiance centrale -->
  <circle cx="256" cy="256" r="140" fill="#E50914" opacity="0.18" filter="blur(40px)"/>

  <!-- L'emblème "H" moderne et épuré -->
  <g filter="url(#softGlow)">
    <!-- Montant gauche du H -->
    <rect x="138" y="136" width="60" height="240" rx="20" fill="url(#redGrad)"/>

    <!-- Montant droit du H -->
    <rect x="314" y="136" width="60" height="240" rx="20" fill="url(#redGrad)"/>

    <!-- Barre transversale (L'Horizon) unissant les deux montants -->
    <rect x="138" y="228" width="236" height="56" rx="16" fill="url(#redGrad)"/>
  </g>

  <!-- Faisceau lumineux d'horizon épuré et ultra-précis -->
  <rect x="100" y="253" width="312" height="6" rx="3" fill="url(#horizonBeam)"/>

  <!-- Éclat central subtil sur la ligne d'horizon -->
  <circle cx="256" cy="256" r="4" fill="#FFFFFF" opacity="0.95"/>
</svg>
